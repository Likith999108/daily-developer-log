name: Daily Developer Log

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create 3 daily commits
        run: |
          DATE=$(date -u +%Y-%m-%d)

          mkdir -p daily

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3
          do
            echo "- Daily update $i — $DATE" >> "daily/$DATE.md"

            git add daily/
            git commit -m "Daily update $i: $DATE"
          done

          git push
