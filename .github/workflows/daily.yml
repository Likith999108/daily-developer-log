name: Daily Developer Log

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily log
        run: |
          DATE=$(date +%Y-%m-%d)

          mkdir -p daily

          echo "# Daily Developer Log - $DATE" > "daily/$DATE.md"
          echo "" >> "daily/$DATE.md"
          echo "- Practiced coding today." >> "daily/$DATE.md"
          echo "- Continued learning and building." >> "daily/$DATE.md"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily/

          git commit -m "Daily developer log: $(date +%Y-%m-%d)"

          git push